distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
# The wrapper downloads the Gradle distribution on every clean machine, including
# every CI run. Without this line that download is unverified, so the build
# executes whatever arrives. Checked two ways rather than copied from one source:
# against Gradle's published gradle-8.14-all.zip.sha256, and against the SHA-256
# of the already-cached distribution on this machine. Both agree.
distributionSha256Sum=efe9a3d147d948d7528a9887fa35abcf24ca1a43ad06439996490f77569b02d1
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
