<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy shipped in the document (GitHub Pages serves no
      custom response headers, so the meta CSP is the enforcement point). The
      app is self-contained: no external origins are permitted for scripts,
      connections, frames, or objects, so nothing can exfiltrate. blob: is
      allowed for the module worker and the operator's courier/plaintext
      downloads; data: for inline icons; 'unsafe-inline' is scoped to STYLE
      only (Vite inlines critical CSS), never to script. See
      docs/BROWSER-SECURITY.md §7 for the exact scope and its limits.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TruePad 2 — authenticated one-time pad</title>
    <meta
      name="description"
      content="Authenticated one-time-pad handling with explicit one-time state — the frozen TruePad 2 protocol, running entirely in your browser. No backend, no accounts, no sync; every security consequence is stated in full."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#11100c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./pwa-192.png" />
    <meta property="og:title" content="TruePad 2 — authenticated one-time pad" />
    <meta
      property="og:description"
      content="The frozen TruePad 2 protocol in the browser: generate a pad pair, send authenticated one-time-pad messages, and see every security consequence — and limitation — stated in full."
    />
    <meta property="og:type" content="website" />
    <!--
      Self-contained by construction: this page references no external origins,
      and the meta CSP above blocks any that a future edit might introduce.
      TruePad makes zero network requests during cryptographic operation. The
      web-app manifest and service worker are injected by the build (VitePWA).
    -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 3rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>TruePad 2</h1>
        <p>
          The Browser Edition runs its cryptographic engine as a JavaScript Web Worker, so it needs JavaScript enabled.
          It still makes no network requests during operation, keeps no accounts, and syncs nothing. The teaching Lab is
          available at <a href="learn.html">/learn</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/browser/main.ts"></script>
  </body>
</html>
