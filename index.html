<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy shipped in the document (GitHub Pages serves no
      custom response headers, so this meta CSP is the enforcement point for the
      directives a meta CSP CAN enforce). It restricts script/style/connect/
      object/frame loading to this origin — defense in depth — but it is NOT a
      proof that data can never leave the browser. `frame-src 'none'` stops THIS
      page from loading child frames; it is NOT the same as `frame-ancestors`,
      which controls who may EMBED this page and is ignored in a meta CSP — so a
      runtime framed-context gate (src/browser/main.ts) refuses to start the
      operational UI in a frame, and HTTP-header frame-ancestors / X-Frame-
      Options would need a hosting layer that can set response headers. blob: is
      allowed for the module worker and the operator's courier/plaintext
      downloads; data: for inline icons; 'unsafe-inline' is scoped to STYLE only
      (Vite inlines critical CSS), never to script. See docs/BROWSER-SECURITY.md
      §7 for the exact scope and its limits.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TruePad — private one-time-pad messaging</title>
    <meta
      name="description"
      content="Send messages only you and one other person can read. TruePad is an authenticated one-time pad that runs entirely in your browser — no backend, no accounts, no sync, and every security limitation stated in full."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./pwa-192.png" />
    <meta property="og:title" content="TruePad — private one-time-pad messaging" />
    <meta
      property="og:description"
      content="Create a pad, share it once with one other person, and message privately. The frozen TruePad 2 protocol in the browser, with every security consequence — and limitation — stated in full."
    />
    <meta property="og:type" content="website" />
    <!--
      Self-contained by construction: this page references no external origins,
      and the meta CSP above restricts any that a future edit might introduce to
      this origin (defense in depth — not a proof that nothing can ever leave).
      TruePad makes zero network requests during cryptographic operation. The
      web-app manifest and service worker are injected by the build (VitePWA).
    -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #e9ebef">
        <h1 style="letter-spacing: -0.025em">TruePad</h1>
        <p>
          The Browser Edition runs its cryptographic engine as a JavaScript Web Worker, so it needs JavaScript enabled.
          It still makes no network requests during operation, keeps no accounts, and syncs nothing. The teaching Lab is
          available at <a href="learn.html">/learn</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/browser/main.ts"></script>
  </body>
</html>
