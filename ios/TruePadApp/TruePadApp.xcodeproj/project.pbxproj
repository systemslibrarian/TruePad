// THIS FILE IS SECURITY-RELEVANT CONFIGURATION, not an incidental build artefact,
// so it is kept small enough to read in full and every entry is deliberate.
//
// Choices a reviewer should be able to confirm at a glance:
//
//   · ONE target, one Swift file, one Info.plist. Nothing else is compiled.
//   · EXPLICIT file references, NOT a PBXFileSystemSynchronizedRootGroup. A
//     synchronized folder silently includes whatever is dropped into it later;
//     an explicit list means adding a file to the app is a reviewable diff.
//   · NO shell script build phase of any kind. Nothing is downloaded, generated,
//     or executed at build time.
//   · No remote package reference IN THIS PROJECT. The crypto comes from the
//     LOCAL in-tree package at ../TruePadKit, which vendors and pins swift-crypto
//     itself, so there is no second resolution path for security-critical code.
//     BUT THE GRAPH IS NOT NETWORK-FREE, and pretending otherwise would be the
//     kind of tidy claim this project does not make: the vendored swift-crypto
//     declares a remote dependency on apple/swift-asn1, so resolving fetches it
//     from github.com. It is reachable only through _CryptoExtras, which is not
//     linked, and it is absent from the built binary (verified by symbol) - so it
//     is a BUILD-MACHINE exposure, not a shipping-binary one. It is pinned by the
//     committed Package.resolved, and ios/scripts/check-app-project.sh requires
//     that pin to match the kit's.
//   · Three package products, all first-party: TruePadUI, TruePadStorage,
//     TruePadSPT. NOT TruePadKATSupport, which is test-only and is not a product
//     at all, and not _CryptoExtras.
//   · No frameworks beyond those products. SwiftUI, AVFoundation and CoreImage
//     are used from the SDK and linked implicitly; none is added here, so none
//     can be swapped for something else here.
//   · PLATFORM REACH IS STATED, not left to a portal checkbox.
//     SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD defaults to YES, which would let an
//     archive run unmodified on Apple silicon. The store/witness failure-domain
//     argument reasons about iOS Data Protection and iOS Keychain accessibility;
//     those do not carry over identically, so the app would be running somewhere
//     it was not audited for. Both it and Catalyst are explicitly NO.
//
//   · DEVELOPMENT_TEAM is EMPTY on purpose. Local device signing supplies it on
//     the command line; a personal Team ID does not belong in source control.
//
