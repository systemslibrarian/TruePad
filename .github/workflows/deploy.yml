# Build the TruePad exhibit and publish it to GitHub Pages.
#
# The unit suites gate the build, the build (which type-checks both the
# browser and the CLI configs) and the Playwright e2e suite gate the deploy: a red test or a type error means the live demo simply does not
# update. Deployment uses the official Pages actions with OIDC — no
# gh-pages branch, no personal tokens.
name: Deploy demo to GitHub Pages

on:
  push:
    # master pushes still get the full build/test/e2e GATE (see the build job),
    # but they NO LONGER auto-publish: master carries whatever is being prepared
    # NEXT, and the public demo must stay on the released line. Only a release tag
    # (v*) or a manual dispatch actually deploys (see the deploy job's `if:`
    # guard): a v* tag push publishes, a master push never does.
    branches: [master]
    tags: ['v*']
  # Every pull request, whatever its base: the lanes of a stacked revision
  # target each other, and each must carry the test/type-check/build gate.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never queue more than one deploy; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The suite spawns bin/truepad-pad.mjs, which needs type stripping
          # (>= 22.18 / 23.6 / any 24). Pin the line the CLI was tested on.
          node-version: 24
          cache: npm
      - run: npm ci

      # WHAT THIS DEPLOYMENT IS MADE OF, stated by the deployment itself.
      #
      # The v3.0.0 tag deployment was REFUSED by the github-pages environment
      # (which permitted only the master branch), and the cutover was then done
      # by dispatch on master at the identical commit. Content was right, ref was
      # not, and NOTHING in the artefact recorded which of those had happened —
      # so "what is Pages serving" could only be answered by correlating API
      # deployment records after the fact. The build now stamps its own ref and
      # SHA into the artefact, so the public site can be asked directly.
      - name: Record the deployment source
        run: |
          set -euo pipefail
          echo "source ref:  $GITHUB_REF"
          echo "source SHA:  $GITHUB_SHA"
          echo "event:       $GITHUB_EVENT_NAME"
          # The checkout must BE the SHA this run claims. A mismatch would mean
          # the artefact does not correspond to the ref it is published under.
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out $actual but this run claims $GITHUB_SHA"
            exit 1
          fi
          echo "checked out: $actual (matches)"

      # Build FIRST: the bundle-boundary assertion in the claim guards reads
      # dist/ and skips when it is absent, so testing before building made
      # the one check that keeps ML-KEM out of the UI thread a no-op in CI.
      - run: npm run build
      # Stamped AFTER the build so `vite build` cannot clear it, and BEFORE the
      # artefact upload so it travels with the deployed bytes.
      - name: Stamp the source into the artefact
        run: |
          set -euo pipefail
          printf '{"ref":"%s","sha":"%s","event":"%s","built_at":"%s"}\n' \
            "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/deploy-source.json
          cat dist/deploy-source.json
      - run: npm test
      # The e2e suite drives the real exhibit in Chromium against the dev
      # server (playwright.config.ts). It gates the deploy like the unit suites.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Keep the traces when the e2e suite is red; they are the only useful
      # artefact of a CI-only failure.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      # Only a release tag (v*) or a manual dispatch publishes. A master push of
      # post-release development runs the full gate above but produces no Pages
      # artifact, so the released public demo is never silently replaced by
      # whatever master happens to be carrying.
      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Turns Pages on for the repo (source: GitHub Actions) if it is not
          # already enabled, so this workflow is the only setup step needed.
          enablement: true
      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # DEPLOY STATUS IS NOT BUILD STATUS, and reading one for the other is how
      # a refused deployment went unnoticed: the build job was green, the deploy
      # job never ran a step, and the run looked ordinary in a list. This step
      # only runs when the deployment actually succeeded, and says what it
      # published and from where.
      - name: State what was published
        run: |
          set -euo pipefail
          echo "deployed ref:  $GITHUB_REF"
          echo "deployed SHA:  $GITHUB_SHA"
          echo "page URL:      ${{ steps.deployment.outputs.page_url }}"
          echo "DEPLOYMENT SUCCEEDED (this line is absent from any run whose deploy step did not)"
