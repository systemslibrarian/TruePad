# Build and test the iOS Edition, and re-verify the supply-chain and isolation
# gates that its security argument depends on.
#
# WHAT THIS WORKFLOW DOES AND DOES NOT COVER, stated plainly so nobody reads a
# green tick as more than it is.
#
#   1. `swift build`, `swift test`, and the same suite again under
#      AddressSanitizer and ThreadSanitizer — the whole engine. TruePadCore (the OTP
#      kernel), TruePadStorage (the durable store) and TruePadSPT (Sealed Pad
#      Transfer) are plain Swift with no UIKit dependency, so the entire security
#      state machine is tested on the runner with no simulator, and the SAME
#      compiled code runs on a device. Includes the X-Wing draft-10 Appendix-C
#      known-answer vectors, the frozen v2.0.0 OTP wire vectors, the cross-edition
#      SPT corpora in all four directions, and the malformed-length corpus.
#
#   2. `ios/scripts/check-release-isolation.sh` — builds a stand-in app as an
#      EXTERNAL package consumer and proves it cannot import, link, or name the
#      deterministic X-Wing encapsulation used to reproduce frozen vectors. That
#      capability is a reuse machine, and "test-only by convention" is not
#      protection; this is the gate that makes it structural.
#
#   3. `ios/vendor/verify-vendor.sh` — re-clones pristine apple/swift-crypto at
#      the pinned COMMIT (a moved tag is treated as a supply-chain event, not a
#      merge conflict), prunes the recorded development-only paths, and requires
#      the diff against the vendored tree to equal EXPECTED-PATCH.diff byte for
#      byte. Unreviewed vendor drift fails here in either direction.
#
#   4. `ios/scripts/check-notices.sh` — the third-party notices must still name
#      the versions actually vendored. A notices file that names a version no
#      longer present is not merely stale; it is a false statement about what the
#      product contains.
#
#   5. A release-configuration build and a real `generic/platform=iOS` device
#      build, so a change that only compiles for the host cannot pass.
#
#   This job is written to be UNABLE to go green over an empty run. `swift test`
#   exits 0 when it discovers no tests, so the summary line is parsed afterwards
#   and the count must meet a floor with zero failures. A suite that vanished is
#   not a passing suite.
#
# STILL NOT COVERED: a physical iPhone. Everything here is a macOS runner, which
# says nothing about real Data Protection with a passcode, real flash, a real
# backup/restore path, the camera, or VoiceOver. Those are human and hardware
# gates and remain OUTSTANDING. See docs/IOS-SECURITY.md.
name: iOS

on:
  # NO PATH FILTER ON MASTER OR ON A RELEASE TAG, DELIBERATELY.
  #
  # This workflow is release-REQUIRED (docs/RELEASE-CHECKLIST-3.0.md Section A).
  # It used to be path-filtered on push, which meant a candidate commit touching
  # none of those paths produced NO RUN AT ALL — and an absent run is visually
  # identical to a passing one in a checks list. During the 3.0.0 release that
  # happened twice, and both times the gap was closed only because someone
  # noticed and dispatched the workflow by hand.
  #
  # Worse, no workflow but deploy.yml declared `tags:`, so pushing the v3.0.0 tag
  # ran exactly one of the five. The release ref itself was the least covered ref
  # in the repository.
  #
  # "It did not run, so nothing it covers can have changed" is fail-OPEN unless
  # something proves it, and nothing did. Pull requests keep the filter, where a
  # missing run costs nothing and cannot be mistaken for a release gate.
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'ios/**'
      - 'docs/IOS-SECURITY.md'
      - 'docs/THIRD-PARTY-NOTICES.md'
      - 'android/vectors/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Record the toolchain
        run: |
          echo "available Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build
        working-directory: ios/TruePadKit
        run: swift build 2>&1 | tail -5

      # The floor exists because `swift test` exits 0 on an empty discovery. It
      # is set below the current count so ordinary additions do not have to touch
      # CI, but high enough that a suite which stopped being compiled in cannot
      # pass unnoticed.
      - name: Test, with a floor and a zero-failure requirement
        working-directory: ios/TruePadKit
        run: |
          set -o pipefail
          # CAPTURE, DO NOT DIE — see the sanitizer steps below for what this cost.
          status=0
          swift test 2>&1 | tee /tmp/ios-tests.log | tail -40 || status=$?
          python3 - "$status" <<'PY'
          import re, sys
          FLOOR = 260
          status = int(sys.argv[1])
          text = open('/tmp/ios-tests.log').read()
          runs = re.findall(r'Executed (\d+) tests?, with (\d+) failures?', text)
          if not runs:
              sys.exit("no 'Executed N tests' summary found — the suite did not run")
          total, failures = max(int(t) for t, _ in runs), max(int(f) for _, f in runs)
          print(f"executed {total} tests, {failures} failures (floor {FLOOR})")
          if failures or status:
              # NAME THEM. A summary line saying "1 failure" and nothing else is
              # a red gate nobody can act on; see the ASan step below for the run
              # where that actually happened.
              for line in text.splitlines():
                  if "' failed (" in line or "error:" in line:
                      print(line)
              sys.exit(f"{failures} test failures (swift test exited {status})")
          if total < FLOOR:
              sys.exit(f"only {total} tests ran, below the floor of {FLOOR} — "
                       "a suite is missing, not passing")
          PY

      # SANITIZERS. The suite is small and fast, so there is no reason to run it
      # only in the plain configuration. AddressSanitizer covers the vendored
      # BoringSSL C that the X-Wing path calls into; ThreadSanitizer covers the
      # engine's locking, which is what stops two concurrent burns taking the same
      # one-time key. ConcurrencyTests exists so TSan has real contention to look
      # at rather than a single-threaded run that would pass vacuously.
      #
      # WHY THESE STEPS PRINT MORE THAN A TAIL. `tee ... | tail -20` keeps a green
      # run short, and that was the whole design — until an ASan run reported
      # "Executed 471 tests, with 1 failure" and NOTHING in the log said which
      # test. The full output existed only in /tmp on a runner that is then
      # destroyed, so the red gate could not be acted on at all: not reproduced,
      # not attributed, not fixed. The tail stays for the ordinary case; a failure
      # now names the failing cases and the whole log is kept as an artifact.
      - name: Test under AddressSanitizer
        working-directory: ios/TruePadKit
        run: |
          set -o pipefail
          # CAPTURE, DO NOT DIE. `shell: bash -e` plus `pipefail` means a failing
          # `swift test` ends the step AT THIS LINE, and every diagnostic written
          # below it never runs. That is exactly how a red run came back saying
          # only "Executed 471 tests, with 1 failure" and naming nothing.
          status=0
          swift test --sanitize=address 2>&1 | tee /tmp/ios-asan.log | tail -20 || status=$?
          if grep -qE 'ERROR: AddressSanitizer|runtime error:' /tmp/ios-asan.log; then
            echo "::error::AddressSanitizer reported a finding"
            grep -nE 'ERROR: AddressSanitizer|runtime error:' -A 25 /tmp/ios-asan.log | head -80 || true
            [ "$status" -ne 0 ] || status=1
          elif [ "$status" -ne 0 ] || ! grep -qE 'Executed [0-9]+ tests, with 0 failures' /tmp/ios-asan.log; then
            echo "::error::the AddressSanitizer run had test failures — the failing cases follow"
            grep -nE "' failed \\(|error:|Test Suite '[A-Za-z]+' failed" /tmp/ios-asan.log | head -60 || true
            [ "$status" -ne 0 ] || status=1
          else
            # A FLOOR, for the same reason the plain run has one: "0 failures" is
            # satisfied by a log in which a single test ran, and a sanitizer build
            # that silently stopped compiling the suite in would read as a pass.
            # Set below the current count so ordinary additions do not touch CI.
            ran="$(sed -nE 's/.*Executed ([0-9]+) tests, with 0 failures.*/\1/p' /tmp/ios-asan.log | sort -rn | head -1)"
            if [ -z "$ran" ] || [ "$ran" -lt 260 ]; then
              echo "::error::only ${ran:-0} tests ran under AddressSanitizer, below the floor of 260 — a suite is missing, not passing"
              status=1
            fi
          fi
          # The ORIGINAL status, so a red run stays red with the code it earned.
          exit "$status"

      - name: Test under ThreadSanitizer
        working-directory: ios/TruePadKit
        run: |
          set -o pipefail
          # CAPTURE, DO NOT DIE. `shell: bash -e` plus `pipefail` means a failing
          # `swift test` ends the step AT THIS LINE, and every diagnostic written
          # below it never runs. That is exactly how a red run came back saying
          # only "Executed 471 tests, with 1 failure" and naming nothing.
          status=0
          swift test --sanitize=thread 2>&1 | tee /tmp/ios-tsan.log | tail -20 || status=$?
          if grep -qE 'WARNING: ThreadSanitizer|data race' /tmp/ios-tsan.log; then
            echo "::error::ThreadSanitizer reported a finding"
            grep -nE 'WARNING: ThreadSanitizer|data race' -A 25 /tmp/ios-tsan.log | head -80 || true
            [ "$status" -ne 0 ] || status=1
          elif [ "$status" -ne 0 ] || ! grep -qE 'Executed [0-9]+ tests, with 0 failures' /tmp/ios-tsan.log; then
            echo "::error::the ThreadSanitizer run had test failures — the failing cases follow"
            grep -nE "' failed \\(|error:|Test Suite '[A-Za-z]+' failed" /tmp/ios-tsan.log | head -60 || true
            [ "$status" -ne 0 ] || status=1
          else
            # A FLOOR, for the same reason the plain run has one: "0 failures" is
            # satisfied by a log in which a single test ran, and a sanitizer build
            # that silently stopped compiling the suite in would read as a pass.
            # Set below the current count so ordinary additions do not touch CI.
            ran="$(sed -nE 's/.*Executed ([0-9]+) tests, with 0 failures.*/\1/p' /tmp/ios-tsan.log | sort -rn | head -1)"
            if [ -z "$ran" ] || [ "$ran" -lt 260 ]; then
              echo "::error::only ${ran:-0} tests ran under ThreadSanitizer, below the floor of 260 — a suite is missing, not passing"
              status=1
            fi
          fi
          # The ORIGINAL status, so a red run stays red with the code it earned.
          exit "$status"

      - name: Keep the test logs when a run is red
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-logs
          path: |
            /tmp/ios-tests.log
            /tmp/ios-asan.log
            /tmp/ios-tsan.log
          if-no-files-found: ignore

      # The symbol-table gate polices the release binary; this polices the gate.
      # It runs on fixtures, needs no iOS build, and is here because the probe it
      # tests was silently false-negative on a real release and nothing noticed.
      - name: The symbol-table probe is not vacuous
        run: ios/scripts/selftest-symtab.sh

      - name: KAT-support isolation is structural
        run: ios/scripts/check-release-isolation.sh

      - name: Vendored swift-crypto matches the reviewed patch exactly
        run: ios/vendor/verify-vendor.sh

      - name: Third-party notices describe what is vendored
        run: ios/scripts/check-notices.sh

      - name: The SBOM matches the tree
        run: ios/scripts/gen-sbom.sh --check

      # The application project's configuration is edited by a GUI: one click can
      # add a capability, link a framework, attach a shell script phase, or change
      # a bundle identifier. This turns the settings TruePad depends on into a
      # test, so such a change fails here rather than shipping.
      - name: The app project declares only what TruePad committed to (static)
        run: ios/scripts/check-app-project.sh

      - name: Release-configuration build
        working-directory: ios/TruePadKit
        # `| tail -5` discards the build's exit status without pipefail, so a
        # BROKEN RELEASE BUILD would have read as a pass. Same defect the test
        # steps above had, in a step nobody had looked at.
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tail -5

      # A host build proves nothing about the device. These steps are what would
      # catch an availability-floor regression - for instance a change that
      # silently reverted to the system CryptoKit X-Wing, which demands iOS 26.
      #
      # The resolve is not optional. xcodebuild GENERATES the package's schemes
      # as a side effect of resolving, so on a clean checkout a build that names
      # a scheme fails with "does not contain a scheme named ...". Resolving
      # first, and listing the schemes into the log, makes that failure mode
      # impossible to hit silently again.
      - name: Resolve the package and record its schemes
        working-directory: ios/TruePadKit
        run: |
          xcodebuild -resolvePackageDependencies 2>&1 | tail -3
          xcodebuild -list 2>&1 | sed -n '/Schemes:/,$p'

      # Each SHIPPING product is built for a real device, by name. Building the
      # whole-package scheme instead would also try to build spt-vector-tool -
      # an executable target that exists only to generate vectors on the host -
      # which is not a thing an iOS device build should be asked to produce.
      - name: Real iOS device build of every shipping product
        working-directory: ios/TruePadKit
        run: |
          set -o pipefail
          for scheme in TruePadCore TruePadClaims TruePadStorage TruePadSPT TruePadUI; do
            echo "=== $scheme ==="
            xcodebuild -scheme "$scheme" \
                       -destination 'generic/platform=iOS' \
                       -derivedDataPath "$RUNNER_TEMP/dd-ios" \
                       build 2>&1 | tail -5
          done

      # The BoringSSL-backed path must be what actually got linked for iOS. If a
      # change ever reverted to the CryptoKit re-export, the X-Wing symbols would
      # be absent and the availability floor would jump to iOS 26 - a regression
      # that a passing test suite on macOS would not reveal.
      # The APPLICATION, built exactly as a device build would be. Unsigned:
      # CI has no signing identity, and signing is not what this proves. What it
      # proves is what LINKED - that the shipping app carries the vendored X-Wing
      # and carries neither the test-only KAT surface nor a networking framework.
      - name: Build the application for a real device (unsigned)
        working-directory: ios/TruePadApp
        run: |
          set -o pipefail
          for config in Debug Release; do
            echo "=== $config ==="
            xcodebuild -project TruePadApp.xcodeproj \
                       -scheme TruePadApp \
                       -configuration "$config" \
                       -destination 'generic/platform=iOS' \
                       -derivedDataPath "$RUNNER_TEMP/dd-app" \
                       CODE_SIGNING_ALLOWED=NO \
                       build 2>&1 | tail -3
          done

      - name: The built application links only what it should
        run: |
          APP="$RUNNER_TEMP/dd-app/Build/Products/Release-iphoneos/TruePad.app"
          if [ ! -d "$APP" ]; then
            echo "no built app at $APP — the binary half would be skipped, which is not evidence"
            exit 1
          fi
          ios/scripts/check-app-project.sh "$APP"

      - name: Inspect what the release binary actually contains
        run: ios/scripts/inspect-release-binary.sh

      - name: Prove the iOS binary links the vendored BoringSSL X-Wing
        run: |
          OBJ="$RUNNER_TEMP/dd-ios/Build/Products/Debug-iphoneos/CCryptoBoringSSL.o"
          if [ ! -f "$OBJ" ]; then
            echo "expected CCryptoBoringSSL.o in the iOS build products; found:"
            find "$RUNNER_TEMP/dd-ios/Build/Products" -maxdepth 2 -name '*.o' | head -20
            exit 1
          fi
          echo "--- platform and deployment target ---"
          otool -l "$OBJ" | grep -A4 LC_BUILD_VERSION | head -8
          # CAPTURE FIRST, DECIDE SECOND. This step is not under `pipefail`
          # today, so `nm | grep -q` does not lie here — but it is the same
          # construct that made the release-binary gate report a present
          # CCryptoBoringSSL_XWING_decap as missing, and it is one `set -o
          # pipefail` away from doing so. Deciding from a file has no producer
          # to kill, and nm's own exit status is the one that counts.
          SYMS="$RUNNER_TEMP/xwing-symbols.txt"
          nm "$OBJ" > "$SYMS" || {
            echo "nm could not read $OBJ — the probe failed; this says nothing about the binary"
            exit 1
          }
          echo "--- X-Wing symbols ---"
          grep -E 'XWING_(encap|decap|generate_key)' "$SYMS" | head -10 || true
          for sym in CCryptoBoringSSL_XWING_encap CCryptoBoringSSL_XWING_decap; do
            grep -qF "$sym" "$SYMS" || {
              echo "the vendored BoringSSL X-Wing is NOT linked for iOS: $sym absent"
              exit 1
            }
          done
          echo "OK: the iOS build links the vendored BoringSSL X-Wing (encap and decap)"
