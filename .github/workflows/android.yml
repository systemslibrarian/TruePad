# Build, lint and test the Android edition, and re-verify that its golden
# interoperability vectors still match the released v2.0.0.
#
# WHAT THIS WORKFLOW DOES AND DOES NOT COVER, stated plainly so nobody reads a
# green tick as more than it is.
#
#   1. `./gradlew check` — the JVM suites for truepad-core and truepad-storage,
#      the app's source audits, Android Lint, and the release-manifest gate.
#      Both engine modules are pure Kotlin/JVM with no Android SDK dependency,
#      so the whole security state machine is tested here with no emulator, and
#      the SAME compiled code runs on ART — there is no separate "Android build"
#      that could drift from the one CI proved.
#
#   2. `:app:assembleDebug` and `:app:assembleRelease` — the manifest is only
#      real once it has been merged, and `verifyReleaseManifest` parses the
#      MERGED RELEASE manifest: one exported component, no permissions, backup
#      off. A dependency that quietly adds an exported receiver breaks the build.
#
#   3. `tools/regenerate-vectors.sh --check` — regenerates android/vectors/ by
#      running the RELEASED v2.0.0 TypeScript in a throwaway detached worktree
#      and fails if the committed fixtures differ. Without it the fixtures are
#      numbers somebody once wrote down; with it, "Android agrees with what
#      shipped" is a claim CI keeps honest. It reads the tag and never writes to
#      any branch, tag, or the release commit.
#
# NOT COVERED HERE: the instrumentation suite and the on-device security check.
# Both need an emulator, and a reliable emulator job in GitHub Actions is its own
# piece of infrastructure. They are REQUIRED gates that run locally:
#
#     ./gradlew :app:connectedDebugAndroidTest
#     ./tools/device-security-check.sh
#
# Saying that here is the honest alternative to pretending the JVM suites replace
# them. See docs/ANDROID-SECURITY.md §10.
name: Android

on:
  push:
    branches: [master, android-phase-2]
    paths: ['android/**', 'docs/ANDROID-SECURITY.md', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'docs/ANDROID-SECURITY.md', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The vector check checks tag v2.0.0 out into a worktree, so the tag
          # and its history must be present — a shallow clone cannot do it.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # The engine targets JVM 17 bytecode (Android-consumable) but builds
          # on 21, matching the JDK gradle.properties pins locally.
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to Android Studio's bundled
      # JBR so local builds do not depend on a registered system JDK. CI has no
      # Android Studio, so point Gradle at the JDK setup-java just installed.
      - name: Use the CI JDK instead of the local Android Studio JBR
        working-directory: android
        run: sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=${JAVA_HOME}|" gradle.properties

      # The Android SDK the app module needs. The engine modules do not, but the
      # app's manifest, resources and lint do.
      - uses: android-actions/setup-android@v3

      - name: Install the pinned SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build, lint and test everything
        working-directory: android
        # `check` runs: the JVM engine suites, the app's source audits, Android
        # Lint (warningsAsErrors), and verifyReleaseManifest.
        run: ./gradlew check --console=plain --stacktrace

      - name: Assemble both build types
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: The APK asks for nothing
        working-directory: android
        # A last, independent look at the artefact itself rather than at the
        # sources that produced it.
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          dump=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          if grep -q 'android.permission.INTERNET' <<<"$dump"; then
            echo "the release APK requests INTERNET" >&2; exit 1
          fi
          exported=$(grep -c 'android:exported=true' <<<"$dump" || true)
          if [ "$exported" != "1" ]; then
            echo "expected exactly one exported component, found $exported" >&2
            grep -B4 'android:exported=true' <<<"$dump" >&2 || true
            exit 1
          fi
          echo "release APK: one exported component, no INTERNET"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/app/build/reports/
          if-no-files-found: ignore

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The released src/ is TypeScript imported directly by the generator,
          # which needs node's native type stripping (>= 22.18).
          node-version: 24
          cache: npm

      # No `npm ci` here on purpose. This branch predates the release's
      # @noble/post-quantum dependency, so installing THIS package.json would
      # not provide it. The script installs the release's own pinned tree inside
      # the v2.0.0 worktree instead, which is the correct authority anyway.
      - name: Verify the golden vectors still match the released v2.0.0
        working-directory: android
        run: ./tools/regenerate-vectors.sh --check
